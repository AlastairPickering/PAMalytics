site_name: PAMalytics
repo_url: https://github.com/AlastairPickering/PAMalytics
repo_name: AlastairPickering/PAMalytics

theme:
  name: material
  logo: assets/brand/pamalytics-logo.png

  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search

nav:
  - Home: index.md
  - Quick start: quick-start.md
  - Projects: first-project.md
  - Dashboard: dashboard.md
  - Validate: validate.md
  - Recalculate: recalculate.md
  - Troubleshooting: troubleshooting.md
  - Release testing: release-testing.md

