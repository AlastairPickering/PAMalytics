# mkdocs.yml
site_name: PAMalytics
repo_url: https://github.com/AlastairPickering/PAMalytics
repo_name: AlastairPickering/PAMalytics

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search

nav:
  - Home: index.md
  - Quick start: quick-start.md
  - Projects:
      - Set up your first project: projects/first-project.md
  - Dashboard: dashboard.md
  - Validate: validate.md
  - Troubleshooting: troubleshooting.md

