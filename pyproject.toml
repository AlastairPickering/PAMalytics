[project]
name = "pamalytics"
version = "0.1.0"
description = "An open source, no-code, classifier-agnostic, interactive dashboard to efficiently review bioacoustic classifier results."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alastair Pickering" }]
dependencies = [
    "altair>=5.0",
    "arviz>=0.16",
    "joblib>=1.3",
    "librosa>=0.10.1",
    "matplotlib>=3.7",
    "noisereduce>=3.0",
    "numba>=0.59,<0.61",
    "numpy>=1.26,<2.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pydeck>=0.8",
    "pymc>=5.0",
    "pyproj>=3.6",
    "scikit-learn>=1.4,<1.6",
    "scipy>=1.11,<1.14",
    "soundfile>=0.12.1",
    "streamlit>=1.33",
    "torch>=2.3,<2.5",
    "torchaudio>=2.3,<2.5",
    "tqdm>=4.66",
]
